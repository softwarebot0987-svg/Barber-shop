<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light"><meta name="supported-color-schemes" content="light"><meta name="theme-color" content="#eee8dc">
<title>Barber Shop Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eee8dc;--tx:#1f2e2c;--mu:#6b7773;--ac:#0f5a5c;--on:#fff;--ok:#2c8a68;--dg:#b3382f;--sl:#fffcf4;--sd:#cdc4b2;--bd:#ddd5c4;--r:6px 6px 14px var(--sd),-6px -6px 14px var(--sl);--rs:3px 3px 7px var(--sd),-3px -3px 7px var(--sl);--i:inset 3px 3px 8px var(--sd),inset -3px -3px 8px var(--sl);color-scheme:only light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Inter","Segoe UI",system-ui,sans-serif;min-height:100vh}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:236px minmax(0,1fr)}
aside{position:sticky;top:0;height:100vh;padding:24px 16px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;gap:12px;align-items:center;font-weight:800;font-size:17px}
.logo{width:42px;height:42px;border-radius:14px;background:var(--ac);color:var(--on);display:grid;place-items:center;box-shadow:var(--r)}
nav{display:flex;flex-direction:column;gap:12px}
nav button{position:relative;display:flex;align-items:center;gap:12px;padding:13px 14px;border:0;border-radius:16px;background:var(--bg);color:var(--tx);font-weight:600;font-size:14px;cursor:pointer;box-shadow:var(--rs);transition:transform .2s,box-shadow .2s,color .2s}
nav button:hover{transform:translateX(3px)}nav button.on{box-shadow:var(--i);color:var(--ac)}
kbd{margin-left:auto;font:600 11px ui-monospace,Consolas,monospace;padding:2px 7px;border-radius:7px;background:var(--bg);box-shadow:var(--rs);color:var(--mu)}
.b kbd{background:rgba(255,255,255,.22);box-shadow:none;color:inherit;margin-left:2px}
.bg{background:#ff2d55;color:#fff;font:700 11px/1 "Inter",sans-serif;min-width:21px;height:21px;border-radius:11px;display:grid;place-items:center;padding:0 6px;margin-left:auto}.bg:empty{display:none}
main{padding:26px 32px 48px;max-width:1500px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
h1{font-size:26px;margin:0;font-weight:800}h2{font-size:16px;margin:0 0 12px}
.chip{display:inline-flex;gap:7px;align-items:center;font-size:12px;color:var(--mu);margin-top:4px}.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(44,138,104,.2)}
.cd{background:var(--bg);border-radius:24px;padding:20px;margin-bottom:20px;box-shadow:var(--r)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.mu{color:var(--mu);font-size:13px}.empty{color:var(--mu);text-align:center;padding:26px 10px}.empty .ic{width:40px;height:40px;opacity:.5;display:block;margin:0 auto 8px}
input,select,textarea{padding:12px 15px;border:2px solid transparent;border-radius:14px;background:var(--bg);color:var(--tx);font-size:15px;min-width:0;flex:1 1 130px;box-shadow:var(--i);transition:border-color .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac)}
.b{padding:11px 19px;border:0;border-radius:999px;background:var(--ac);color:var(--on);font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none;box-shadow:var(--rs);transition:transform .15s,box-shadow .2s,filter .2s;white-space:nowrap}
.b:hover{transform:translateY(-2px);filter:brightness(1.08)}.b:active{transform:scale(.94);box-shadow:var(--i)}
.b.g{background:var(--bg);color:var(--tx)}.b.ok{background:var(--ok);color:var(--on)}.b.dg{background:var(--dg);color:var(--on)}
.b:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:grayscale(.6)}
.b.ld{pointer-events:none}.b.ld::before{content:"";width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .6s linear infinite}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.stats>div{border-radius:20px;padding:15px;text-align:center;box-shadow:var(--r)}.stats b{display:block;font-size:26px;color:var(--ac)}
.now{text-align:center}.big{font-size:60px;font-weight:800;color:var(--ac);line-height:1.1}
.tok{background:var(--ac);color:var(--on);border-radius:999px;padding:3px 11px;font-weight:700;font-size:13px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--ac);box-shadow:var(--rs);flex:none}
.qg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:20px}.g2>.cd{margin:0}
.wl{max-height:calc(100vh - 150px);overflow:auto;padding:6px 10px 10px;margin:0 -10px}
.swr{position:relative;margin:12px 0}.swr>span{position:absolute;top:50%;transform:translateY(-50%);font-weight:700;font-size:12px;color:var(--mu)}.swr .l{left:18px}.swr .r{right:18px}
.li{position:relative;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:20px;background:var(--bg);box-shadow:var(--rs);touch-action:pan-y;user-select:none;transition:transform .3s,box-shadow .2s;cursor:grab}
.li.sel{box-shadow:var(--i),0 0 0 2px var(--ac)}
.pl{display:flex;gap:8px;flex-wrap:wrap}.pl label{position:relative;display:block;margin:0}.pl input{position:absolute;opacity:0;pointer-events:none}
.pl span{display:block;padding:9px 16px;border-radius:999px;box-shadow:var(--rs);cursor:pointer;font-weight:600;font-size:14px;color:var(--tx);text-transform:none;letter-spacing:0;transition:.2s}
.pl input:checked+span{background:var(--ac);color:var(--on);box-shadow:var(--i)}.pl input:focus-visible+span{outline:2px solid var(--ac);outline-offset:2px}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0}.bar .l{width:100px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar .t{flex:1;border-radius:8px;height:20px;overflow:hidden;box-shadow:var(--i)}.bar .f{height:100%;background:var(--ac);border-radius:8px}.bar .v{width:76px;text-align:right;font-size:13px;font-weight:700}
.pie{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.lg{flex:1 1 150px;font-size:13px}.lg div{display:flex;align-items:center;gap:6px;margin:4px 0}.lg i{width:12px;height:12px;border-radius:4px;display:inline-block}
svg.ch{width:100%;height:auto;display:block}.tabs-hide{display:none}
details summary{cursor:pointer;margin-top:8px}
#md{position:fixed;inset:0;display:grid;place-items:center;background:rgba(8,18,17,.5);backdrop-filter:blur(3px);z-index:50;animation:fi .2s}#md[hidden]{display:none}
.mb{width:min(480px,92vw);max-height:92vh;overflow:auto;background:var(--bg);border-radius:28px;padding:26px;box-shadow:var(--r);animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
.mb h2{font-size:20px;margin:0 0 4px}.mb>div>label,.mb #mf>label{display:block;font-size:12px;font-weight:700;color:var(--mu);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.05em}.mb input:not([type=radio]),.mb textarea{width:100%}
.kt{width:100%;border-collapse:collapse;font-size:14px}.kt td{padding:7px 4px;border-bottom:1px solid var(--bd)}.kt td:first-child{width:120px}.fld{flex:1 1 200px;display:flex;flex-direction:column;gap:6px}.fld label{font-size:12px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}.fld input{flex:none;width:100%}.fld small{color:var(--mu);font-size:12px}
#tw{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:12px;align-items:flex-end;z-index:60}
.ts{display:flex;gap:14px;align-items:center;padding:12px 16px;border-radius:16px;background:var(--bg);box-shadow:var(--r);font-weight:600;border-left:5px solid var(--ok);animation:tin .35s cubic-bezier(.2,1.2,.4,1);max-width:min(420px,90vw)}
.ts.er{border-color:var(--dg)}.ts.out{animation:tout .25s forwards}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes fi{from{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.9) translateY(14px)}}
@keyframes tin{from{opacity:0;transform:translateX(60px)}}@keyframes tout{to{opacity:0;transform:translateX(60px)}}
@keyframes inr{from{opacity:0;transform:translateX(48px)}}@keyframes inl{from{opacity:0;transform:translateX(-48px)}}
.inr{animation:inr .35s cubic-bezier(.2,.9,.3,1)}.inl{animation:inl .35s cubic-bezier(.2,.9,.3,1)}
@media not all and (min-width:1100px) and (hover:hover) and (pointer:fine){.qg{grid-template-columns:minmax(0,1fr)}.wl{max-height:none}}
@media not all and (min-width:900px) and (hover:hover) and (pointer:fine){.app{display:block}.hk,.kc{display:none}.li,.li .row{flex-wrap:wrap!important}main{padding:16px 14px 100px}h1{font-size:22px}.stats{gap:10px}.stats b{font-size:20px}
aside{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:20;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));background:#121212;border-radius:22px 22px 0 0}.brand{display:none}
nav{flex-direction:row;width:100%}nav button{flex:1;flex-direction:column;gap:3px;background:none;box-shadow:none;color:#fff;font-size:10px;padding:6px 2px}nav button.on{color:#5fe0d8;box-shadow:none}nav button:hover{transform:none}nav kbd,.b kbd{display:none}
.bg{position:absolute;top:-2px;left:54%;margin:0}#tw{bottom:calc(84px + env(safe-area-inset-bottom,0px));right:12px}}
#gate{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:80;padding:16px}#gate[hidden]{display:none}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><symbol id="i-q" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol><symbol id="i-b" viewBox="0 0 24 24"><path d="M6 9a3 3 0 100-6 3 3 0 000 6zM6 21a3 3 0 100-6 3 3 0 000 6zM20 4L8.1 15.9M14.5 14.5L20 20M8.1 8.1L12 12"/></symbol><symbol id="i-p" viewBox="0 0 24 24"><path d="M3 7h18v12H3zM3 7l3-3h12l3 3M16 13h2"/></symbol><symbol id="i-r" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol><symbol id="i-c" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM22 21v-2a4 4 0 00-3-3.9M16 3.1a4 4 0 010 7.8"/></symbol><symbol id="i-s" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol></svg>
<div class="app">
<aside><div class="brand"><div class="logo"><svg class="ic"><use href="#i-b"/></svg></div><span id="shopn">Barber Shop</span></div>
<nav id="nav" aria-label="Sections"><button data-t="q" class="on"><svg class="ic"><use href="#i-q"/></svg><span>Queue</span><i class="bg" id="bq"></i><kbd>1</kbd></button><button data-t="b"><svg class="ic"><use href="#i-b"/></svg><span>Barbers</span><kbd>2</kbd></button><button data-t="p"><svg class="ic"><use href="#i-p"/></svg><span>Payroll</span><kbd>3</kbd></button><button data-t="r"><svg class="ic"><use href="#i-r"/></svg><span>Reports</span><kbd>4</kbd></button><button data-t="c"><svg class="ic"><use href="#i-c"/></svg><span>Clients</span><kbd>5</kbd></button><button data-t="s"><svg class="ic"><use href="#i-s"/></svg><span>Settings</span><kbd>6</kbd></button></nav></aside>
<main id="mn"><header class="top"><div><div class="mu" id="bc"></div><h1 id="pt">Queue</h1><div class="chip" id="sync">Connecting…</div></div><div class="row"><button class="b g hk" onclick="help()" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button></div></header>
<section id="q"></section><section id="b" class="tabs-hide"></section><section id="p" class="tabs-hide"></section><section id="r" class="tabs-hide"></section><section id="c" class="tabs-hide"></section><section id="s" class="tabs-hide"></section><section id="a" class="tabs-hide"></section></main></div>
<div id="tw" aria-live="polite"></div><div id="md" hidden></div><div id="gate" hidden></div>
<script>
const SERVICES=[["Haircut",150],["Beard trim",80],["Haircut + Beard",220],["Shave",70],["Head massage",100],["Hair colour",400],["Custom",0]];
const TABS=["q","b","p","r","c","s"],NAMES={q:"Queue",b:"Barbers",p:"Payroll",r:"Reports",c:"Clients",s:"Settings"};
const KEYS=[["1 – 6","Switch section"],["N","New client"],["S","Start next service"],["P","Collect payment"],["↑ ↓","Select waiting client"],["Enter","Start selected client / confirm"],["Esc","Close window"],["?","Show shortcuts"]];
const S={queue:[],barbers:[],customerProfiles:{},cfg:{shop:"My Barber Shop",avg:15,cc:"91"}};
let db=null,tab="q",sel=0,mdOpen=false;const DESK=matchMedia("(min-width:900px) and (hover:hover) and (pointer:fine)");
const LOCAL_KEY="barber-shop-manager-v2";
function persistLocal(){try{localStorage.setItem(LOCAL_KEY,JSON.stringify(S))}catch(e){}}
function restoreLocal(){try{const x=JSON.parse(localStorage.getItem(LOCAL_KEY)||"null");if(x){S.queue=Array.isArray(x.queue)?x.queue:[];S.barbers=Array.isArray(x.barbers)?x.barbers:[];S.customerProfiles=x.customerProfiles||{};S.cfg={...S.cfg,...(x.cfg||{})}}}catch(e){}}
restoreLocal();
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ld=iso=>{const d=iso?new Date(iso):new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const today=()=>ld(),month=()=>ld().slice(0,7);
const money=n=>"₹"+Math.round(n).toLocaleString("en-IN");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const customerKey=x=>String(x.phone||"").replace(/\D/g,"").slice(-10)||String(x.name||"").trim().toLowerCase().replace(/[^a-z0-9]/g,"");
const dateTime=ms=>ms?new Date(ms).toLocaleString():"Time not recorded";
const waiting=()=>S.queue.filter(x=>x.date===today()&&x.status==="waiting").sort((a,b)=>a.token-b.token);
const serving=()=>S.queue.filter(x=>x.date===today()&&x.status==="serving").sort((a,b)=>a.token-b.token);
const empty=t=>`<div class="empty"><svg class="ic"><use href="#i-c"/></svg>${t}</div>`;

async function save(col,id,obj){const arr=col==="queue"?S.queue:S.barbers,i=arr.findIndex(x=>x.id===id);if(i>=0)arr[i]=obj;else arr.push(obj);persistLocal();render(true);
  if(db){try{await db.collection(col).doc(id).set(obj)}catch(e){flash("Could not save: only the owner or invited staff can edit.")}}}
async function del(col,id){const k=col==="queue"?"queue":"barbers";S[k]=S[k].filter(x=>x.id!==id);persistLocal();render(true);if(db){try{await db.collection(col).doc(id).delete()}catch(e){}}}
async function saveCfg(){render(true);if(db){try{await db.doc("meta/cfg").set(S.cfg)}catch(e){}}}
function flash(m){$("sync").textContent=m}
function phoneFull(p){let d=String(p||"").replace(/\D/g,"");if(d.length===10)d=S.cfg.cc+d;return d}
function waLink(c,msg){return "https://wa.me/"+phoneFull(c.phone)+"?text="+encodeURIComponent(msg)}
function ahead(c){return S.queue.filter(x=>x.date===today()&&x.status==="waiting"&&x.token<c.token).length}
function msgFor(c){const a=ahead(c),w=a*S.cfg.avg;
  if(c.status==="serving")return `Hello ${c.name}, it’s your turn at ${S.cfg.shop}! Token #${c.token}. Please come to the chair now.`;
  return `Hello ${c.name}, your token at ${S.cfg.shop} is #${c.token}. ${a} client(s) ahead of you, about ${w} min wait. We’ll message you when it’s your turn.`}

/* ---------- UI helpers: toast + modal (no browser dialogs) ---------- */
function toast(m,t,a){const e=document.createElement("div");e.className="ts "+(t||"");e.innerHTML=`<span>${esc(m)}</span>`+(a?`<a class="b" target="_blank" rel="noopener" href="${a.h}">${a.t}</a>`:"");$("tw").append(e);setTimeout(()=>{e.classList.add("out");setTimeout(()=>e.remove(),260)},a?8000:3500)}
function ask(o){return new Promise(res=>{const m=$("md"),prev=document.activeElement;
  m.innerHTML=`<div class="mb" role="dialog" aria-modal="true"><h2>${o.t}</h2>${o.p?`<div class="mu">${o.p}</div>`:""}<div id="mf">${o.f||""}</div><div class="row" style="justify-content:flex-end;margin-top:22px"><button class="b g" id="mc">${o.c||"Cancel"} <kbd>Esc</kbd></button><button class="b ${o.d?"dg":"ok"}" id="mo">${o.ok||"Confirm"} <kbd>↵</kbd></button></div></div>`;
  m.hidden=false;mdOpen=true;
  const fin=v=>{m.hidden=true;m.innerHTML="";mdOpen=false;document.removeEventListener("keydown",kd,true);if(prev&&prev.focus)prev.focus();res(v)};
  const val=()=>{const v={};m.querySelectorAll("[name]").forEach(i=>{if(i.type==="radio"&&!i.checked)return;v[i.name]=i.value});return v};
  const go=()=>{$("mo").classList.add("ld");setTimeout(()=>fin(val()),380)};
  const kd=e=>{if(e.key==="Escape"){e.preventDefault();e.stopPropagation();fin(null)}
    else if(e.key==="Enter"&&e.target.tagName!=="TEXTAREA"&&e.target.id!=="mc"){e.preventDefault();e.stopPropagation();go()}
    else if(e.key==="Tab"){const f=[...m.querySelectorAll("input:not([type=radio]),select,textarea,button,input[type=radio]:checked")],i=f.indexOf(document.activeElement),n=e.shiftKey?(i<=0?f.length-1:i-1):(i+1)%f.length;e.preventDefault();f[n].focus()}};
  document.addEventListener("keydown",kd,true);
  $("mo").onclick=go;$("mc").onclick=()=>fin(null);m.onclick=e=>{if(e.target===m)fin(null)};
  const f=m.querySelector("input:not([type=radio]),select,textarea");if(f&&DESK.matches){f.focus();if(f.select)f.select()}else $("mo").focus()})}
function help(){ask({t:"Keyboard shortcuts",f:`<table class="kt">${KEYS.map(k=>`<tr><td><kbd style="margin:0">${k[0]}</kbd></td><td>${k[1]}</td></tr>`).join("")}</table>`,ok:"Got it",c:"Close"})}

/* ---------- Queue ---------- */
function renderQ(){
  const keep=["cn","cp","cs","cx","cr","cb"].map(i=>$(i)?.value);
  const t=S.queue.filter(x=>x.date===today()).sort((a,b)=>a.token-b.token);
  const sv=t.filter(x=>x.status==="serving"),wait=t.filter(x=>x.status==="waiting"),dn=t.filter(x=>x.status==="done");
  const rev=dn.reduce((s,x)=>s+(+x.price||0),0);
  sel=Math.max(0,Math.min(sel,wait.length-1));
  const bopts=S.barbers.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join("");
  const sopts=SERVICES.map(s=>`<option value="${s[0]}|${s[1]}">${s[0]}</option>`).join("");
  let h=`<div class="qg"><div><div class="stats"><div><b>${wait.length}</b><span class="mu">Waiting</span></div><div><b>${dn.length}</b><span class="mu">Completed today</span></div><div><b>${money(rev)}</b><span class="mu">Revenue today</span></div></div>`;
  h+=`<div class="cd now"><div class="mu">Now serving</div>`;
  h+=sv.length?sv.map(c=>`<div class="big">#${c.token}</div><div><b>${esc(c.name)}</b> · ${esc(c.service)} · ${esc(S.barbers.find(b=>b.id===c.barber)?.name||"Any barber")}</div><div class="row" style="justify-content:center;margin-top:12px"><a class="b g" href="tel:${phoneFull(c.phone)}">📞 Call</a><button class="b ok" onclick="finish('${c.id}')">✔ Collect payment · ${money(c.price)} <kbd>P</kbd></button></div>`).join(""):`<div class="big">—</div>`;
  h+=`<div style="margin-top:14px"><button class="b" onclick="startNext()" ${wait.length?"":"disabled"}>▶ Start next service <kbd>S</kbd></button></div></div>`;
  h+=`<div class="cd" id="addf"><h2>New client <span class="mu hk">(N)</span></h2><div class="mu" style="margin:-6px 0 12px">Next token: <b>#${Math.max(0,...t.map(x=>x.token))+1}</b> · restarts at #1 every day</div><div class="row"><input id="cn" list="dn" oninput="fillC('n')" placeholder="Name" autocomplete="off"><input id="cp" list="dp" oninput="fillC('p')" placeholder="Phone (10 digits)" inputmode="tel" autocomplete="off"></div>${dl()}<div class="mu" id="cinfo"></div>

function calc(b){const m=month(),rev=S.queue.filter(x=>x.barber===b.id&&x.status==="done"&&x.doneAt&&ld(x.doneAt).slice(0,7)===m).reduce((s,x)=>s+(+x.price||0),0);

  return{rev,comm,bon,paid,due:b.base+comm+bon-paid}}

async function pay(id){const b=S.barbers.find(x=>x.id===id),c=calc(b),v=await ask({t:"Pay barber",p:`${esc(b.name)} · balance due ${money(c.due)}`,ok:"Record payment",f:`<label for="a">Amount (₹)</label><input id="a" name="a" type="number" min="1" value="${Math.max(0,Math.round(c.due))}"><label for="n">Note</label><input id="n" name="n" type="text" placeholder="Cash / UPI / advance">`});

function custs(){const m={};
  S.queue.filter(x=>x.status!=="skipped").sort((a,b)=>(a.at||0)-(b.at||0)).forEach(x=>{const k=customerKey(x);if(!k)return;
    const c=m[k]||(m[k]={key:k,hist:[],arrivals:[],visits:0,spent:0});c.name=x.name;c.phone=x.phone;c.arrivals.push(x);
    if(x.status==="done"){c.visits++;c.spent+=+x.price||0;c.hist.push(x);c.service=x.service;c.price=x.price;c.barber=x.barber;c.last=x.doneAt;if(x.rating)c.ratings=(c.ratings||[]).concat(+x.rating)}});

/* ---------- Reports ---------- */
const PAL=["#0f5a5c","#2c8a68","#d9a441","#3d6fa8","#8a5a9e","#c9694b","#8d8a82"];
function group(arr,key){const m={};arr.forEach(x=>{const k=key(x);m[k]=(m[k]||0)+(+x.price||0)});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function renderR(){
  const dn=S.queue.filter(x=>x.status==="done"&&x.doneAt),td=today(),m=month(),sum=a=>a.reduce((s,x)=>s+(+x.price||0),0);
  const dT=dn.filter(x=>ld(x.doneAt)===td),dM=dn.filter(x=>ld(x.doneAt).slice(0,7)===m),avg=dM.length?sum(dM)/dM.length:0;
  let h=`<div class="stats"><div><span class="mu">Today</span><b>${money(sum(dT))}</b><span class="mu">${dT.length} clients</span></div><div><span class="mu">This month</span><b>${money(sum(dM))}</b><span class="mu">${dM.length} clients</span></div><div><span class="mu">Avg / client</span><b>${money(avg)}</b><span class="mu">this month</span></div></div>`;
  if(!dM.length){$("r").innerHTML=h+`<div class="cd">${empty("Charts appear once payments are collected.")}</div>`;return}
  const sv=group(dM,x=>x.service),tot=sum(dM);let a0=-Math.PI/2,paths="";
  sv.forEach(([n,v],i)=>{const f=v/tot,a1=a0+f*2*Math.PI,c=PAL[i%PAL.length];
    if(f>=0.999)paths+=`<circle cx="80" cy="80" r="70" fill="${c}"/>`;else paths+=`<path d="M80 80 L${80+70*Math.cos(a0)} ${80+70*Math.sin(a0)} A70 70 0 ${f>.5?1:0} 1 ${80+70*Math.cos(a1)} ${80+70*Math.sin(a1)} Z" fill="${c}"/>`;a0=a1});
  h+=`<div class="g2"><div class="cd"><h2>Revenue by service (this month)</h2><div class="pie"><svg viewBox="0 0 160 160" width="160" height="160">${paths}</svg><div class="lg">${sv.map(([n,v],i)=>`<div><i style="background:${PAL[i%PAL.length]}"></i>${esc(n)} · ${money(v)} (${Math.round(v/tot*100)}%)</div>`).join("")}</div></div></div>`;
  const bb=group(dM,x=>S.barbers.find(b=>b.id===x.barber)?.name||"Any / unassigned"),mx=bb[0][1]||1;
  h+=`<div class="cd"><h2>Revenue by barber (this month)</h2>${bb.map(([n,v])=>`<div class="bar"><div class="l">${esc(n)}</div><div class="t"><div class="f" style="width:${v/mx*100}%"></div></div><div class="v">${money(v)}</div></div>`).join("")}</div>`;
  const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=ld(d.toISOString());days.push({k,l:k.slice(8)+"/"+k.slice(5,7),v:sum(dn.filter(x=>ld(x.doneAt)===k))})}
  const w=days.slice(7),wm=Math.max(1,...w.map(x=>x.v));
  h+=`<div class="cd"><h2>Last 7 days</h2><svg class="ch" viewBox="0 0 320 150">${w.map((x,i)=>{const bh=x.v/wm*100,bx=10+i*44;return `<rect x="${bx}" y="${120-bh}" width="32" height="${bh}" rx="6" fill="var(--ac)"/><text x="${bx+16}" y="${114-bh}" text-anchor="middle" font-size="9" fill="var(--tx)">${x.v?Math.round(x.v):""}</text><text x="${bx+16}" y="138" text-anchor="middle" font-size="9" fill="var(--mu)">${x.l}</text>`}).join("")}<line x1="0" y1="120" x2="320" y2="120" stroke="var(--bd)"/></svg></div>`;
  const lm=Math.max(1,...days.map(x=>x.v)),pts=days.map((x,i)=>[34+i*(278/13),110-x.v/lm*95]),ps=pts.map(p=>p.join(",")).join(" ");
  h+=`<div class="cd"><h2>Daily revenue trend (14 days)</h2><svg class="ch" viewBox="0 0 320 150"><line x1="34" y1="110" x2="312" y2="110" stroke="var(--bd)"/><line x1="34" y1="15" x2="312" y2="15" stroke="var(--bd)" stroke-dasharray="3"/><text x="30" y="18" text-anchor="end" font-size="9" fill="var(--mu)">${Math.round(lm)}</text><text x="30" y="113" text-anchor="end" font-size="9" fill="var(--mu)">0</text><polygon points="34,110 ${ps} 312,110" fill="var(--ac)" opacity=".15"/><polyline points="${ps}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--ac)"/>`).join("")}${days.map((x,i)=>i%3===0||i===13?`<text x="${pts[i][0]}" y="130" text-anchor="middle" font-size="9" fill="var(--mu)">${x.l}</text>`:"").join("")}</svg></div></div>`;
  $("r").innerHTML=h;
}

document.addEventListener("keydown",e=>{
  if(mdOpen)return;const t=e.target;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)){if(e.key==="Escape")t.blur();else if(t.closest("#addf")&&e.key==="Enter"&&t.tagName!=="SELECT"){e.preventDefault();addC()}return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key,w=waiting();
  if(/^[1-7]$/.test(k)){if(TABS[k-1])go(TABS[k-1])}
  else if(k==="ArrowRight"||k==="ArrowLeft"){const n=TABS[TABS.indexOf(tab)+(k==="ArrowRight"?1:-1)];if(n)go(n)}
  else if(tab==="q"&&(k==="ArrowDown"||k==="ArrowUp")){e.preventDefault();sel=Math.max(0,Math.min(w.length-1,sel+(k==="ArrowDown"?1:-1)));updSel()}
  else if(tab==="q"&&k==="Enter"&&w[sel]&&t.tagName!=="BUTTON"&&t.tagName!=="A")startNext(w[sel].id);
  else switch(k.toLowerCase()){
    case"n":e.preventDefault();go("q");setTimeout(()=>$("cn")?.focus(),0);break;
    case"s":startNext();break;
    case"p":if(serving()[0])finish(serving()[0].id);break;
    case"w":if(w[sel])window.open(waLink(w[sel],msgFor(w[sel])),"_blank");break;
    case"x":case"delete":if(tab==="q"&&w[sel])skip(w[sel].id);break;

/* writes go through a small retry queue so nothing is lost while offline */
async function runOp(o){const q=sb.from("docs"),{error}=o.t==="s"?await q.upsert({shop_id:o.s,col:o.c,id:o.i,data:o.d,updated_at:new Date().toISOString()}):await q.delete().match({shop_id:o.s,col:o.c,id:o.i});if(error)throw error}
async function flush(){if(flushing)return false;flushing=true;
  try{while(pend.length){try{await runOp(pend[0])}catch(e){if(e.code){pend.shift();savePend();continue}flash("Offline · will sync when back online");return false}pend.shift();savePend()}return true}finally{flushing=false}}
async function op(o){const c=cache[o.c];if(c){if(o.t==="s")c[o.i]=o.d;else delete c[o.i]}pend.push(o);savePend();await flush()}
function notify(c){if(c==="meta"){const v=cache.meta.cfg;subs.meta.forEach(f=>f({exists:!!v,data:()=>v}))}else{const docs=Object.entries(cache[c]).map(([id,v])=>({id,data:()=>v}));subs[c].forEach(f=>f({docs}))}}
const makeDb=()=>({
  collection:c=>({doc:id=>({set:o=>op({t:"s",s:shopId,c,i:id,d:o}),delete:()=>op({t:"d",s:shopId,c,i:id})}),onSnapshot:f=>{subs[c].push(f);notify(c)}}),
  doc:p=>{const[c,i]=p.split("/");return{set:o=>op({t:"s",s:shopId,c,i,d:o}),onSnapshot:f=>{subs[c].push(f);notify(c)}}}});
async function pull(id){let rows=[],from=0;
  for(;;){const{data,error}=await sb.from("docs").select("col,id,data").eq("shop_id",id).order("col").order("id").range(from,from+999);if(error)throw error;rows=rows.concat(data);if(data.length<1000)break;from+=1000}
  COLS.forEach(c=>cache[c]={});rows.forEach(r=>{if(cache[r.col])cache[r.col][r.id]=r.data});return rows.length}
async function resync(){if(!synced)return;try{if(await flush()){await pull(shopId);COLS.forEach(notify)}}catch(e){}}
function stopSync(){synced=false;db=null;firstSub=true;COLS.forEach(c=>{subs[c]=[]});if(dataCh){sb.removeChannel(dataCh);dataCh=null}}
async function startSync(id){
  if(synced)return;synced=true;shopId=id;
  const prev=lsGet("bsm-shop");
  if(prev&&prev!==id){S.queue=[];S.barbers=[];S.customerProfiles={};pend=pend.filter(o=>o.s===id);savePend()}
  lsSet("bsm-shop",id);
  try{
    if(!(await flush()))throw new Error("offline");
    const n=await pull(id);
    if(!n&&!prev){ /* first sign-in on a device that already has local data: upload it */
      const up=[...S.queue.map(x=>["queue",x.id,x]),...S.barbers.map(x=>["barbers",x.id,x]),...Object.entries(S.customerProfiles).map(([k,v])=>["customers",k,v]),["meta","cfg",S.cfg]];
      const{error}=await sb.from("docs").upsert(up.map(([c,i,d])=>({shop_id:id,col:c,id:i,data:d})));if(error)throw error;
      up.forEach(([c,i,d])=>{cache[c][i]=d})}
  }catch(e){synced=false;flash(/offline|fetch|network/i.test(e.message||"")?"Offline · saved on this device":"Sync error");return}
  db=makeDb();
  db.collection("queue").onSnapshot(s=>{S.queue=s.docs.map(d=>({id:d.id,...d.data()}));persistLocal();render()});
  db.collection("barbers").onSnapshot(s=>{S.barbers=s.docs.map(d=>({id:d.id,...d.data()}));persistLocal();render()});
  db.collection("customers").onSnapshot(s=>{S.customerProfiles={};s.docs.forEach(d=>S.customerProfiles[d.id]=d.data());persistLocal();render()});
  db.doc("meta/cfg").onSnapshot(d=>{if(d.exists&&d.data())S.cfg={...S.cfg,...d.data()};persistLocal();render()});
  dataCh=sb.channel("docs-"+id).on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{
      const r=p.eventType==="DELETE"?p.old:p.new;if(!r||r.shop_id!==id||!cache[r.col])return;
      if(p.eventType==="DELETE")delete cache[r.col][r.id];else cache[r.col][r.id]=r.data;notify(r.col)})
    .subscribe(st=>{if(st==="SUBSCRIBED"){flash("Live · synced");if(!firstSub)resync();firstSub=false}else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"||st==="CLOSED")flash("Reconnecting…")});
}
/* remote on/off: instant via realtime, plus a check every 45 s as a safety net */
